# Builds the Windows and Linux releases and publishes them.
#
# Push a tag like `v0.1.0` to build and publish a GitHub release with the
# ready-to-run archives. "Run workflow" builds the same archives without
# publishing, as downloadable artifacts — useful for a pre-tag check.
#
# Windows live capture needs WinDivert, which is fetched and staged next to the
# executables. Linux live capture uses libpcap: the job installs its headers to
# build and bundles the shared library next to the binaries, because Debian and
# Ubuntu call it libpcap.so.0.8 while Fedora and Arch call it libpcap.so.1. The
# Linux job runs on 22.04 rather than `-latest` so the binaries only require
# glibc 2.35 and run on current stable distros.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  WINDIVERT_VERSION: 2.2.2
  # Pinned in vcpkg-overlay-ports before the C++ tree was dropped; kept here
  # so CI fetches the exact driver the build script expects.
  WINDIVERT_SHA512: 92eb2ef98ced175d44de1cdb7c52f2ebc534b6a997926baeb83bfe94cba9287b438f796aff11f6163918bcdbc25bcd4e3383715f139f690d207ce219f846a345

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Fetch WinDivert
        run: |
          $wd = "rust/.windivert"
          $zip = "$wd/WinDivert-$env:WINDIVERT_VERSION-A.zip"
          $dir = "$wd/WinDivert-$env:WINDIVERT_VERSION-A"
          New-Item -ItemType Directory $wd -Force | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/basil00/WinDivert/releases/download/v$env:WINDIVERT_VERSION/WinDivert-$env:WINDIVERT_VERSION-A.zip" `
            -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA512).Hash.ToLower()
          if ($hash -ne $env:WINDIVERT_SHA512) { throw "WinDivert hash mismatch" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          # Tolerate a top-level folder inside the archive.
          $nested = Get-ChildItem $dir -Directory | Where-Object { Test-Path "$($_.FullName)/x64/WinDivert.dll" } | Select-Object -First 1
          if ($nested -and $nested.FullName -ne $dir -and -not (Test-Path "$dir/x64/WinDivert.dll")) {
            Get-ChildItem $nested.FullName | Move-Item -Destination $dir -Force
            Remove-Item $nested.FullName -Recurse -Force
          }

      - name: Check and test
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets
          cargo test --workspace
        working-directory: rust

      - name: Build release
        run: cargo build --release -p zzz-cli -p zzz-gui
        working-directory: rust

      - name: Stage package
        run: |
          New-Item -ItemType Directory dist/assets -Force | Out-Null
          Copy-Item rust/target/release/zzzgui.exe, rust/target/release/zzzcap.exe, rust/target/release/WinDivert.dll, rust/target/release/WinDivert64.sys dist/
          Copy-Item assets/datamine.json, assets/nap.json, assets/manifest.json dist/assets/
          # The name cache is fetched on first start when absent; ship it when
          # present so a fresh install works fully offline.
          if (Test-Path assets/nanokaData.json) { Copy-Item assets/nanokaData.json dist/assets/ }
          Compress-Archive -Path dist/* -DestinationPath dist/zzz-packet-capture-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zzz-packet-capture-win64
          path: dist/zzz-packet-capture-win64.zip

  build-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check and test
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets
          cargo test --workspace
        working-directory: rust

      - name: Build release
        # Bundle libpcap and resolve it relative to the executable: Debian and
        # Ubuntu name the library libpcap.so.0.8 while Fedora and Arch use
        # libpcap.so.1, so a plain dynamic link would only run on one family.
        env:
          RUSTFLAGS: '-C link-arg=-Wl,-rpath,$ORIGIN/lib'
        run: cargo build --release -p zzz-cli -p zzz-gui
        working-directory: rust

      - name: Stage package
        run: |
          mkdir -p dist-linux/assets dist-linux/lib
          cp rust/target/release/zzzcap rust/target/release/zzzgui dist-linux/
          cp /usr/lib/x86_64-linux-gnu/libpcap.so.0.8 dist-linux/lib/
          # libpcap is BSD-3-Clause; ship its notice with the copy.
          cp /usr/share/doc/libpcap0.8/copyright dist-linux/lib/libpcap.COPYRIGHT
          cp assets/datamine.json assets/nap.json assets/manifest.json dist-linux/assets/
          # The name cache is fetched on first start when absent; ship it when
          # present so a fresh install works fully offline.
          if [ -f assets/nanokaData.json ]; then cp assets/nanokaData.json dist-linux/assets/; fi
          # Prove the bundled library is what the loader finds, without root.
          readelf -d dist-linux/zzzcap | grep -E '(RPATH|RUNPATH).*\$ORIGIN/lib'
          ldd dist-linux/zzzcap | grep 'libpcap.so.0.8 => .*dist-linux/lib'
          dist-linux/zzzcap --help > /dev/null
          mkdir -p dist
          tar -C dist-linux -czf dist/zzz-packet-capture-linux-x86_64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zzz-packet-capture-linux-x86_64
          path: dist/zzz-packet-capture-linux-x86_64.tar.gz

  publish:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: zzz-packet-capture-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zzz-packet-capture-win64.zip
            dist/zzz-packet-capture-linux-x86_64.tar.gz
          generate_release_notes: true
