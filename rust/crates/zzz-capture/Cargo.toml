[package]
name = "zzz-capture"
description = "Live UDP capture: WinDivert on Windows, libpcap on Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
zzz-wire = { path = "../zzz-wire" }

# libpcap is the only system library in the tree. It is linked dynamically and
# only on Linux; the Windows backend keeps using the WinDivert DLL.
[target.'cfg(target_os = "linux")'.dependencies]
pcap = "2.5"
