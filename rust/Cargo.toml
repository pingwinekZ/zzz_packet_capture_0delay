[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
clap = { version = "4", features = ["derive"] }
# Sync, like everything else here; the default `rustls` provider avoids a system
# TLS library. `gzip` is on by default too, which the raw GitHub host uses.
ureq = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
